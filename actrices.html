<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> JAV ACTRICES - Cine +18</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; }
        .header {
            background: linear-gradient(135deg, #9b59b6, #6c3483);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .back-btn {
            position: absolute;
            left: 20px;
            top: 20px;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
        }
        .header h1 { margin-bottom: 5px; }
        .header p { color: #ddd; font-size: 14px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .actriz {
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: white;
            display: block;
        }
        .actriz:hover { transform: scale(1.02); background: #2a2a2a; }
        .actriz img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .titulo { padding: 12px; text-align: center; font-weight: bold; }
        .video-count {
            text-align: center;
            font-size: 11px;
            color: #9b59b6;
            margin-bottom: 10px;
        }
        .footer { text-align: center; padding: 20px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="cine.html" class="back-btn">← Volver</a>
        <h1>🎭 Actrices</h1>
        <p>Presentaciones, entrevistas y trayectoria</p>
    </div>
    <div class="grid" id="listaActrices"></div>
    <div class="footer">Cine Rave - Contenido cultural</div>

    <script>
        async function cargarActrices() {
            try {
                const res = await fetch('datos/actrices.json?t=' + Date.now());
                if (!res.ok) throw new Error();
                const actrices = await res.json();
                const grid = document.getElementById('listaActrices');
                grid.innerHTML = '';
                
                if (actrices.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">📭 No hay actrices registradas. Ve al panel de administración.</p>';
                    return;
                }
                
                actrices.forEach(actriz => {
                    const totalVideos = actriz.videos ? actriz.videos.length : 0;
                    const card = document.createElement('a');
                    card.href = `actriz_detalle.html?id=${actriz.id}`;
                    card.className = 'actriz';
                    card.innerHTML = `
                        <img src="${actriz.portada}" alt="${actriz.nombre}" onerror="this.src='https://via.placeholder.com/200x300?text=Sin+imagen'">
                        <div class="titulo">${escapeHTML(actriz.nombre)}</div>
                        <div class="video-count">📹 ${totalVideos} video${totalVideos !== 1 ? 's' : ''}</div>
                    `;
                    grid.appendChild(card);
                });
            } catch(e) {
                document.getElementById('listaActrices').innerHTML = '<p style="text-align:center; grid-column:1/-1;">❌ Error al cargar actrices.</p>';
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        cargarActrices();
    </script>
</body>
</html>
