<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reproductor Optimizado Kosmi</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        video { width: 100%; height: 100%; max-height: 100vh; object-fit: contain; }
    </style>
</head>
<body>
    <video id="videoPlayer" width="100%" height="100%" controls preload="auto"></video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('url');
        
        if (!videoUrl) {
            document.body.innerHTML = '<h1 style="color:white;text-align:center;">Error: No se especificó URL del video</h1>';
        } else {
            const video = document.getElementById('videoPlayer');
            videoUrl = decodeURIComponent(videoUrl);
            
            let errorCount = 0;
            let reloadTimeout = null;
            
            // Limpiar fuente anterior
            while (video.firstChild) {
                video.removeChild(video.firstChild);
            }
            
            const source = document.createElement('source');
            source.src = videoUrl;
            source.type = 'video/mp4';
            video.appendChild(source);
            video.load();
            
            // Timeout de carga: 15 segundos
            let timeout = setTimeout(() => {
                if (video.readyState === 0) {
                    console.log("Timeout: El video no carga, mostrando mensaje");
                    document.body.innerHTML = '<div style="color:white;text-align:center;padding:50px;"><h2>⏱️ El video tarda demasiado en cargar</h2><p>Verifica tu conexión o intenta más tarde.</p><button onclick="location.reload()" style="margin-top:20px;padding:10px;background:#ffcc00;border:none;border-radius:5px;">⟳ Reintentar</button></div>';
                }
            }, 15000);
            
            // Manejo de errores CON límite de intentos
            video.onerror = function(e) {
                console.warn("Error en el video:", video.error);
                
                // Solo reintentar si no hemos superado los intentos
                if (errorCount < 2) {
                    errorCount++;
                    console.log(`Reintentando (${errorCount}/2) en 3 segundos...`);
                    
                    // Mostrar mensaje al usuario
                    const msg = document.createElement('div');
                    msg.id = 'loadingMsg';
                    msg.style.cssText = 'position:fixed;bottom:20px;left:0;right:0;text-align:center;color:#ffcc00;background:#000000aa;padding:10px;font-family:sans-serif';
                    msg.textContent = `🔄 Reintentando cargar... (${errorCount}/2)`;
                    document.body.appendChild(msg);
                    
                    // Esperar 3 segundos antes de reintentar
                    clearTimeout(reloadTimeout);
                    reloadTimeout = setTimeout(() => {
                        const msgDiv = document.getElementById('loadingMsg');
                        if (msgDiv) msgDiv.remove();
                        video.load();
                        setTimeout(() => video.play(), 500);
                    }, 3000);
                } else {
                    console.log("Demasiados errores, mostrando mensaje final");
                    document.body.innerHTML = '<div style="color:white;text-align:center;padding:50px;"><h2>❌ Error al cargar el video</h2><p>El servidor no responde o el enlace ha expirado.</p><button onclick="location.reload()" style="margin-top:20px;padding:10px;background:#ffcc00;border:none;border-radius:5px;">⟳ Reintentar</button></div>';
                }
            };
            
            video.addEventListener('loadedmetadata', () => {
                clearTimeout(timeout);
                if (video.readyState >= 2) {
                    video.play().catch(e => console.log("Autoplay bloqueado:", e));
                }
            });
            
            video.addEventListener('canplay', () => {
                clearTimeout(timeout);
                // Eliminar mensaje de reintento si existe
                const msgDiv = document.getElementById('loadingMsg');
                if (msgDiv) msgDiv.remove();
            });
            
            video.addEventListener('playing', () => {
                clearTimeout(timeout);
                const msgDiv = document.getElementById('loadingMsg');
                if (msgDiv) msgDiv.remove();
            });
        }
    </script>
</body>
</html>
