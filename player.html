<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reproductor Video.js - Kosmi</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body, html { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
        .video-js { width: 100vw; height: 100vh; }
        .vjs-control-bar { background: rgba(0,0,0,0.7) !important; }
    </style>
</head>
<body>

    <video id="my-player" class="video-js vjs-big-play-centered" controls preload="auto" crossorigin="anonymous" playsinline></video>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url') ? decodeURIComponent(urlParams.get('url')) : null;

        if (!videoUrl) {
            document.body.innerHTML = `<div style="color:red;padding:50px;text-align:center;">❌ No se encontró URL del video</div>`;
        }

        const player = videojs('my-player', {
            techOrder: ['html5'],
            html5: {
                vhs: { overrideNative: true }
            },
            controlBar: {
                audioTrackButton: true,   // Intenta mostrar botón de audio
                fullscreenToggle: true,
                pictureInPictureToggle: true
            },
            playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2],
            fluid: true
        });

        player.src({
            src: videoUrl,
            type: 'video/mp4'
        });

        // Mostrar información de pistas
        player.ready(() => {
            console.log("Player cargado");

            player.on('loadedmetadata', () => {
                const audioTracks = player.audioTracks();
                console.log('Pistas de audio detectadas:', audioTracks.length);

                if (audioTracks.length > 1) {
                    console.log('Múltiples pistas disponibles (mejor en Safari)');
                } else {
                    console.log('Solo una pista de audio detectada o no soportada por el navegador');
                }
            });
        });

        // Opcional: Botón manual si no aparece el nativo
        player.on('audiotrackchange', () => {
            console.log('Audio cambiado');
        });
    </script>
</body>
</html>
