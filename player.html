<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reproductor HLS</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: black; }
        video { width: 100%; height: 100vh; object-fit: contain; }
        .error {
            color: #ff6666;
            text-align: center;
            padding: 50px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <video id="videoPlayer" width="100%" height="100%" controls></video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('url');
        
        if (!videoUrl) {
            document.body.innerHTML = '<div class="error">❌ Error: No se especificó URL del video</div>';
        } else {
            videoUrl = decodeURIComponent(videoUrl);
            const video = document.getElementById('videoPlayer');
            
            // Detectar si es HLS (.m3u8)
            if (videoUrl.endsWith('.m3u8') || videoUrl.includes('.m3u8?')) {
                if (Hls.isSupported()) {
                    const hls = new Hls({
                        debug: false,
                        enableWorker: true,
                        // Cabeceras adicionales para evitar bloqueos
                        xhrSetup: function(xhr, url) {
                            // Añadir referer para engañar al servidor
                            xhr.setRequestHeader('Referer', 'https://be7713.rcr82.waw05.r6n9ed.com/');
                            xhr.setRequestHeader('Origin', 'https://be7713.rcr82.waw05.r6n9ed.com');
                        }
                    });
                    hls.loadSource(videoUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(e => console.log('Autoplay bloqueado:', e));
                    });
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        console.error('HLS Error:', data);
                        if (data.fatal) {
                            document.body.innerHTML = `<div class="error">❌ Error al cargar el stream HLS.<br><small>El servidor puede estar bloqueando la reproducción.</small></div>`;
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari nativo
                    video.src = videoUrl;
                    video.addEventListener('loadedmetadata', () => video.play());
                } else {
                    document.body.innerHTML = '<div class="error">❌ Tu navegador no soporta reproducción HLS</div>';
                }
            } else {
                // MP4 normal
                video.src = videoUrl;
                video.load();
                video.play().catch(e => console.log('Autoplay bloqueado'));
            }
            
            video.onerror = function() {
                document.body.innerHTML = `<div class="error">❌ Error al cargar el video<br><small>URL: ${videoUrl.substring(0, 80)}...</small></div>`;
            };
        }
    </script>
</body>
</html>
