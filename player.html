<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reproductor Universal</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        video { width: 100%; height: 100%; max-height: 100vh; object-fit: contain; }
    </style>
</head>
<body>
    <video id="videoPlayer" width="100%" height="100%" controls preload="auto"></video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('url');
        
        if (!videoUrl) {
            document.body.innerHTML = '<h1 style="color:white;text-align:center;">Error: No se especificó URL del video</h1>';
        } else {
            const video = document.getElementById('videoPlayer');
            videoUrl = decodeURIComponent(videoUrl);
            
            // Detectar si es HLS (.m3u8)
            const esHLS = videoUrl.toLowerCase().includes('.m3u8');
            
            if (esHLS && Hls.isSupported()) {
                // Usar HLS.js para streams .m3u8
                const hls = new Hls();
                hls.loadSource(videoUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay bloqueado"));
                });
                hls.on(Hls.Events.ERROR, (_, data) => {
                    if (data.fatal) {
                        console.error("Error fatal HLS, recargando...");
                        window.location.reload();
                    }
                });
            } else {
                // Reproducción directa para MP4 y otros formatos
                video.preload = 'auto';
                
                video.onerror = function(e) {
                    console.warn("Error en el video, intentando recuperar...");
                    video.load();
                    setTimeout(() => video.play(), 1000);
                };
                
                while (video.firstChild) {
                    video.removeChild(video.firstChild);
                }
                
                const source = document.createElement('source');
                source.src = videoUrl;
                source.type = 'video/mp4';
                video.appendChild(source);
                video.load();
                
                video.addEventListener('loadedmetadata', () => {
                    if (video.readyState >= 2) {
                        video.play().catch(e => console.log("Autoplay bloqueado:", e));
                    }
                });
                
                let timeout = setTimeout(() => {
                    if (video.readyState === 0) {
                        console.log("Timeout: forzando recarga");
                        video.load();
                    }
                }, 8000);
                
                video.addEventListener('canplay', () => clearTimeout(timeout));
            }
        }
    </script>
</body>
</html>
