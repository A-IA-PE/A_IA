<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reproductor Avanzado - Kosmi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: 'Segoe UI', Arial, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .video-container { flex: 1; background: #000; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        .controls-bar {
            background: linear-gradient(to top, #000000ee, #00000099);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            z-index: 100;
        }
        
        .ctrl-btn {
            background: #1e1e1e;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .ctrl-btn:hover { background: #333; }
        .ctrl-btn.active { background: #ffcc00; color: black; font-weight: bold; }
        
        .info, .status { color: #aaa; font-size: 13px; }
        .status { color: #ffcc00; }
        .error { color: #ff6666; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="videoPlayer" controls crossorigin="anonymous" playsinline>
            Tu navegador no soporta video HTML5.
        </video>
    </div>

    <div class="controls-bar">
        <div class="info">🎬 <span id="statusText">Cargando...</span></div>
        
        <div id="audioButtons" style="display:flex; gap:8px;"></div>
        
        <div class="status" id="audioStatus">🔊 Audio: --</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('url');
        
        if (!videoUrl) {
            document.querySelector('.video-container').innerHTML = '<div class="error">❌ No se especificó URL del video</div>';
            return;
        }

        videoUrl = decodeURIComponent(videoUrl);
        const video = document.getElementById('videoPlayer');
        const statusText = document.getElementById('statusText');
        const audioStatus = document.getElementById('audioStatus');
        const audioButtons = document.getElementById('audioButtons');

        video.src = videoUrl;
        video.preload = 'metadata';

        // === Detectar pistas de audio ===
        function detectAudioTracks() {
            audioButtons.innerHTML = '';
            
            if (video.audioTracks && video.audioTracks.length > 0) {
                statusText.textContent = `${video.audioTracks.length} pista(s) de audio detectada(s)`;
                
                Array.from(video.audioTracks).forEach((track, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'ctrl-btn';
                    btn.textContent = `${track.language ? track.language.toUpperCase() : 'Track'} ${index + 1} ${track.label || ''}`;
                    btn.dataset.index = index;
                    
                    btn.addEventListener('click', () => {
                        // Desactivar todas
                        Array.from(video.audioTracks).forEach(t => t.enabled = false);
                        // Activar la seleccionada
                        video.audioTracks[index].enabled = true;
                        
                        document.querySelectorAll('#audioButtons .ctrl-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        
                        audioStatus.textContent = `🔊 Audio: ${track.language || 'Track ' + (index+1)}`;
                    });
                    
                    audioButtons.appendChild(btn);
                    
                    // Activar la primera por defecto (o buscar español)
                    if (index === 0 || (track.language && track.language.includes('es'))) {
                        track.enabled = true;
                        btn.classList.add('active');
                        audioStatus.textContent = `🔊 Audio: ${track.language || 'Principal'}`;
                    }
                });
            } else {
                statusText.textContent = 'Video cargado (detección de pistas limitada)';
                audioStatus.textContent = '⚠️ Este navegador no detecta múltiples pistas de audio en MP4';
                
                // Botón fallback
                const fallback = document.createElement('button');
                fallback.className = 'ctrl-btn';
                fallback.textContent = '🔊 Cambiar Audio (limitado)';
                fallback.onclick = () => alert('La detección de múltiples audios no está soportada en este navegador.\n\nPrueba en Safari o usa HLS.');
                audioButtons.appendChild(fallback);
            }
        }

        // Eventos
        video.addEventListener('loadedmetadata', () => {
            statusText.textContent = 'Metadata cargada ✓';
            detectAudioTracks();
        });

        video.addEventListener('canplay', () => {
            statusText.textContent = 'Listo para reproducir';
        });

        video.onerror = (e) => {
            console.error('Video error:', video.error);
            let msg = 'Error al cargar video';
            if (video.error?.code === 2) msg = 'Error de red (¿enlace expirado?)';
            if (video.error?.code === 4) msg = 'Formato no soportado';
            statusText.textContent = `❌ ${msg}`;
        };

        // Intentar detectar también después de load
        video.addEventListener('loadeddata', detectAudioTracks);
    </script>
</body>
</html>
