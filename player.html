<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reproductor Universal (MP4 + HLS)</title>
    <!-- Librería HLS.js para reproducir streams .m3u8 en navegadores que no lo soportan nativamente -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        video { width: 100%; height: 100%; max-height: 100vh; object-fit: contain; }
        .error-msg, .loading-msg { position: fixed; bottom: 20px; left: 0; right: 0; text-align: center; color: #ffcc00; background: #000000aa; padding: 10px; font-family: sans-serif; z-index: 100; }
        .error-msg { color: #ff6666; }
    </style>
</head>
<body>
    <video id="videoPlayer" width="100%" height="100%" controls preload="auto"></video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('url');
        
        function mostrarMensaje(mensaje, esError = false) {
            let msgDiv = document.getElementById('playerMsg');
            if (!msgDiv) {
                msgDiv = document.createElement('div');
                msgDiv.id = 'playerMsg';
                document.body.appendChild(msgDiv);
            }
            msgDiv.className = esError ? 'error-msg' : 'loading-msg';
            msgDiv.textContent = mensaje;
            if (!esError) {
                setTimeout(() => { if(msgDiv) msgDiv.remove(); }, 5000);
            }
        }

        function limpiarMensaje() {
            const msgDiv = document.getElementById('playerMsg');
            if (msgDiv) msgDiv.remove();
        }

        if (!videoUrl) {
            document.body.innerHTML = '<h1 style="color:white;text-align:center;">Error: No se especificó URL del video</h1>';
        } else {
            const video = document.getElementById('videoPlayer');
            videoUrl = decodeURIComponent(videoUrl);
            
            // --- 1. LIMPIAR FUENTES ANTERIORES ---
            while (video.firstChild) {
                video.removeChild(video.firstChild);
            }
            
            // --- 2. DETECTAR FORMATO ---
            const esHLS = videoUrl.toLowerCase().includes('.m3u8');
            let hlsInstance = null;
            
            if (esHLS && Hls.isSupported()) {
                // --- REPRODUCCIÓN HLS (.m3u8) CON HLS.JS ---
                mostrarMensaje('🔄 Cargando stream HLS...');
                hlsInstance = new Hls({
                    debug: false,
                    enableWorker: true,
                });
                
                hlsInstance.loadSource(videoUrl);
                hlsInstance.attachMedia(video);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    limpiarMensaje();
                    video.play().catch(e => console.log("Autoplay bloqueado (HLS):", e));
                });
                
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    console.error("Error HLS:", data);
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            mostrarMensaje('❌ Error de red. Reintentando...', true);
                            setTimeout(() => window.location.reload(), 3000);
                        } else {
                            mostrarMensaje('❌ Error al reproducir el stream HLS.', true);
                        }
                    }
                });
                
            } else {
                // --- REPRODUCCIÓN MP4/DIRECTA (TU CÓDIGO ROBUSTO) ---
                video.preload = 'auto';
                
                let errorCount = 0;
                let reloadTimeout = null;
                
                const source = document.createElement('source');
                source.src = videoUrl;
                source.type = 'video/mp4';
                video.appendChild(source);
                video.load();
                
                // Timeout de carga (15 segundos)
                let timeout = setTimeout(() => {
                    if (video.readyState === 0) {
                        console.log("Timeout MP4: el video no carga");
                        mostrarMensaje('⏱️ El video tarda demasiado. Verifica tu conexión.', true);
                    }
                }, 15000);
                
                video.onerror = function(e) {
                    console.warn("Error en video MP4:", video.error);
                    if (errorCount < 2) {
                        errorCount++;
                        mostrarMensaje(`🔄 Reintentando (${errorCount}/2) en 3 segundos...`);
                        clearTimeout(reloadTimeout);
                        reloadTimeout = setTimeout(() => {
                            limpiarMensaje();
                            video.load();
                            setTimeout(() => video.play(), 500);
                        }, 3000);
                    } else {
                        mostrarMensaje('❌ Error al cargar el video. El enlace puede haber expirado.', true);
                    }
                };
                
                video.addEventListener('loadedmetadata', () => {
                    clearTimeout(timeout);
                    limpiarMensaje();
                    if (video.readyState >= 2) {
                        video.play().catch(e => console.log("Autoplay bloqueado MP4:", e));
                    }
                });
                
                video.addEventListener('canplay', () => {
                    clearTimeout(timeout);
                    limpiarMensaje();
                });
                
                video.addEventListener('playing', () => {
                    clearTimeout(timeout);
                    limpiarMensaje();
                });
            }
            
            // --- LIMPIEZA FINAL AL SALIR O RECARGAR ---
            window.addEventListener('beforeunload', () => {
                if (hlsInstance) {
                    hlsInstance.destroy();
                }
            });
        }
    </script>
</body>
</html>
