<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reproductor Kosmi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100vh;
            object-fit: contain;
        }
        .error {
            color: #ff6666;
            text-align: center;
            padding: 20px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <video id="videoPlayer" width="100%" height="100%" controls autoplay></video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('url');
        
        if (!videoUrl) {
            document.body.innerHTML = '<div class="error">❌ Error: No se especificó URL del video</div>';
        } else {
            videoUrl = decodeURIComponent(videoUrl);
            const video = document.getElementById('videoPlayer');
            
            // Método más simple y compatible
            video.src = videoUrl;
            video.load();
            
            // Auto reproducción con manejo de errores
            video.play().catch(e => {
                console.log("Auto reproducción bloqueada, el usuario debe dar clic");
                // Mostrar mensaje amigable
                const msg = document.createElement('div');
                msg.style.cssText = 'position:fixed;bottom:20px;left:0;right:0;text-align:center;color:#aaa;background:#000000aa;padding:10px;font-family:sans-serif';
                msg.textContent = '🎬 Haz clic en el video para reproducir';
                document.body.appendChild(msg);
                setTimeout(() => msg.remove(), 3000);
            });
            
            // Manejo de errores
            video.onerror = function() {
                const errorMsg = video.error ? 
                    (video.error.code === 2 ? 'Error de red. El enlace puede haber expirado.' :
                     video.error.code === 4 ? 'Formato no soportado.' :
                     'Error al cargar el video.') : 'Error desconocido.';
                document.body.innerHTML = `<div class="error">❌ ${errorMsg}<br><small>URL: ${videoUrl.substring(0, 80)}...</small></div>`;
            };
        }
    </script>
</body>
</html>
