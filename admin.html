<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administrar Cine Rave</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #eee; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 16px; }
        h1, h2 { text-align: center; }
        input, textarea, button { width: 100%; margin: 8px 0; padding: 10px; border-radius: 8px; border: none; }
        button { background: #ffcc00; color: #1a1a1a; font-weight: bold; cursor: pointer; }
        button.danger { background: #cc3333; color: white; }
        .pelicula-item { background: #3a3a3a; margin: 10px 0; padding: 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
        .pelicula-item img { width: 50px; height: 75px; object-fit: cover; border-radius: 6px; }
        .pelicula-info { flex: 1; }
        .pelicula-info strong { display: block; }
        .acciones button { width: auto; margin: 0 5px; padding: 5px 10px; }
        .token-input { background: #111; color: #0f0; font-family: monospace; }
        .status { margin-top: 10px; padding: 8px; border-radius: 8px; text-align: center; }
        .status.ok { background: #2e7d32; }
        .status.error { background: #c62828; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎬 Administrar películas para Rave</h1>
    <div>
        <label>🔑 Token GitHub:</label>
        <input type="password" id="tokenInput" class="token-input" placeholder="Pega tu token clásico con permisos repo">
        <button id="guardarTokenBtn">Guardar token (solo en memoria)</button>
    </div>
    <div id="status"></div>

    <hr>
    <h2>📋 Lista actual</h2>
    <div id="listaAdmin"></div>

    <hr>
    <h2>➕ Añadir nueva película</h2>
    <input type="text" id="titulo" placeholder="Título de la película">
    <input type="text" id="portada" placeholder="URL de la imagen de portada (jpg/png)">
    <input type="text" id="videoUrl" placeholder="URL del video (enlace directo .mp4 o Pastebin con reproductor)">
    <button id="agregarBtn">Agregar película</button>
</div>

<script>
    let githubToken = '';
    let repoOwner = '';
    let repoName = '';

    function extraerRepoInfo() {
        const partes = window.location.pathname.split('/');
        if (partes.length >= 2) {
            repoOwner = window.location.hostname.split('.')[0];
            repoName = partes[1];
        } else {
            repoOwner = prompt("Usuario de GitHub (owner):", "A_IA");
            repoName = prompt("Nombre del repositorio:", "A_IA");
        }
    }
    extraerRepoInfo();

    const statusDiv = document.getElementById('status');
    function mostrarStatus(mensaje, esError = false) {
        statusDiv.innerHTML = `<div class="status ${esError ? 'error' : 'ok'}">${mensaje}</div>`;
        setTimeout(() => { if(statusDiv.innerHTML === mensaje) statusDiv.innerHTML = ''; }, 3000);
    }

    async function cargarPeliculasDesdeAPI() {
        if (!githubToken) { mostrarStatus("❌ Primero ingresa el token", true); return []; }
        const url = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/peliculas.json`;
        try {
            const res = await fetch(url, { headers: { Authorization: `token ${githubToken}` } });
            if (res.status === 404) return [];
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            const contenido = atob(data.content);
            return JSON.parse(contenido);
        } catch(e) {
            console.error(e);
            if(e.message.includes('404')) return [];
            mostrarStatus("Error al leer peliculas.json: " + e.message, true);
            return null;
        }
    }

    async function guardarPeliculas(peliculas) {
        if (!githubToken) { mostrarStatus("Token no ingresado", true); return false; }
        const url = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/peliculas.json`;
        let sha = null;
        try {
            const res = await fetch(url, { headers: { Authorization: `token ${githubToken}` } });
            if (res.ok) {
                const data = await res.json();
                sha = data.sha;
            }
        } catch(e) {}
        const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(peliculas, null, 2))));
        const payload = {
            message: "Actualización de catálogo desde admin",
            content: contentBase64,
            branch: "main"
        };
        if (sha) payload.sha = sha;
        const response = await fetch(url, {
            method: "PUT",
            headers: { Authorization: `token ${githubToken}`, "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        if (response.ok) {
            mostrarStatus("✅ Guardado correctamente en GitHub");
            return true;
        } else {
            const err = await response.text();
            mostrarStatus("❌ Error al guardar: " + err, true);
            return false;
        }
    }

    async function actualizarListaAdmin() {
        const peliculas = await cargarPeliculasDesdeAPI();
        if (peliculas === null) return;
        const contenedor = document.getElementById('listaAdmin');
        if (!peliculas.length) {
            contenedor.innerHTML = '<p>No hay películas. ¡Añade una!</p>';
            return;
        }
        contenedor.innerHTML = '';
        peliculas.forEach((peli, idx) => {
            const div = document.createElement('div');
            div.className = 'pelicula-item';
            div.innerHTML = `
                <img src="${peli.portada}" onerror="this.src='https://via.placeholder.com/50x75'">
                <div class="pelicula-info">
                    <strong>${escapeHTML(peli.titulo)}</strong>
                    <small>${peli.videoUrl.substring(0, 50)}...</small>
                </div>
                <div class="acciones">
                    <button class="editar" data-idx="${idx}">✏️ Editar</button>
                    <button class="eliminar" data-idx="${idx}">❌ Eliminar</button>
                </div>
            `;
            contenedor.appendChild(div);
        });
        document.querySelectorAll('.editar').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const idx = parseInt(btn.dataset.idx);
                const pelis = await cargarPeliculasDesdeAPI();
                if (!pelis) return;
                const p = pelis[idx];
                document.getElementById('titulo').value = p.titulo;
                document.getElementById('portada').value = p.portada;
                document.getElementById('videoUrl').value = p.videoUrl;
                if (confirm(`Editar "${p.titulo}"? Se eliminará el registro actual y se añadirá uno nuevo.`)) {
                    pelis.splice(idx, 1);
                    await guardarPeliculas(pelis);
                    document.getElementById('agregarBtn').click();
                }
            });
        });
        document.querySelectorAll('.eliminar').forEach(btn => {
            btn.addEventListener('click', async () => {
                const idx = parseInt(btn.dataset.idx);
                const pelis = await cargarPeliculasDesdeAPI();
                if (!pelis) return;
                if (confirm(`¿Eliminar "${pelis[idx].titulo}"?`)) {
                    pelis.splice(idx, 1);
                    await guardarPeliculas(pelis);
                    actualizarListaAdmin();
                }
            });
        });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    document.getElementById('guardarTokenBtn').addEventListener('click', () => {
        githubToken = document.getElementById('tokenInput').value.trim();
        if (!githubToken) {
            mostrarStatus("Token vacío", true);
        } else {
            mostrarStatus("Token cargado en memoria (no se almacena de forma permanente)");
            actualizarListaAdmin();
        }
    });

    document.getElementById('agregarBtn').addEventListener('click', async () => {
        if (!githubToken) { mostrarStatus("Primero ingresa el token", true); return; }
        const titulo = document.getElementById('titulo').value.trim();
        const portada = document.getElementById('portada').value.trim();
        const videoUrl = document.getElementById('videoUrl').value.trim();
        if (!titulo || !portada || !videoUrl) {
            mostrarStatus("Completa todos los campos", true);
            return;
        }
        const peliculas = await cargarPeliculasDesdeAPI();
        if (peliculas === null) return;
        const nuevoId = Date.now();
        peliculas.push({ id: nuevoId, titulo, portada, videoUrl });
        const exito = await guardarPeliculas(peliculas);
        if (exito) {
            document.getElementById('titulo').value = '';
            document.getElementById('portada').value = '';
            document.getElementById('videoUrl').value = '';
            actualizarListaAdmin();
        }
    });
</script>
</body>
</html>
