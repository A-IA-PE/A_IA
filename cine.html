<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Rave - Inicio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 3rem;
            background: linear-gradient(45deg, #ffcc00, #ff6600);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header p { color: #aaa; margin-top: 10px; }
        
        /* Tarjetas de sección */
        .secciones {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-bottom: 50px;
        }
        .card {
            background: rgba(30,30,50,0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            width: 250px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card:hover {
            transform: translateY(-10px);
            border-color: #ffcc00;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .card .emoji { font-size: 64px; display: block; margin-bottom: 15px; }
        .card h2 { font-size: 28px; margin-bottom: 10px; }
        .card p { color: #aaa; font-size: 14px; }
        .card.peliculas:hover { background: rgba(255,68,68,0.2); }
        .card.series:hover { background: rgba(68,68,255,0.2); }
        .card.envivo:hover { background: rgba(68,255,68,0.2); }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            border-top: 1px solid #222;
            margin-top: 40px;
        }
        .admin-link {
            background: #333;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            color: #ffcc00;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .card { width: 180px; padding: 20px; }
            .card .emoji { font-size: 48px; }
            .card h2 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Cine Rave</h1>
            <p>Reproduce en grupo con Kosmi • Rave • Watch2Gether</p>
        </div>
        
        <div class="secciones">
            <div class="card peliculas" onclick="window.location.href='peliculas.html'">
                <span class="emoji">🎬</span>
                <h2>Películas</h2>
                <p>Estrenos, clásicos y más</p>
            </div>
            <div class="card series" onclick="window.location.href='series.html'">
                <span class="emoji">📺</span>
                <h2>Series</h2>
                <p>Temporadas y capítulos</p>
            </div>
            <div class="card envivo" onclick="window.location.href='envivo.html'">
                <span class="emoji">🔴</span>
                <h2>EN VIVO</h2>
                <p>Canales 24/7</p>
            </div>
        </div>
        
        <div class="footer">
            <a href="admin.html" class="admin-link">🔧 Administrar contenido</a>
        </div>
    </div>
</body>
</html>
