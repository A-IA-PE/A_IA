<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Películas - Cine Rave</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; }
        .header {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { margin-bottom: 10px; }
        .back-btn {
            position: absolute;
            left: 20px;
            top: 20px;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .pelicula {
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: white;
            display: block;
        }
        .pelicula:hover { transform: scale(1.02); background: #2a2a2a; }
        .pelicula img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .titulo { padding: 12px; text-align: center; font-weight: bold; }
        .footer { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <a href="cine.html" class="back-btn">← Volver</a>
        <h1>🎬 Películas</h1>
        <p>Selecciona una para ver en grupo</p>
    </div>
    <div class="grid" id="listaPeliculas"></div>
    <div class="footer">Cine Rave - Compatible con Kosmi y Rave</div>

    <script>
        async function cargarPeliculas() {
            try {
                const res = await fetch('datos/peliculas.json?t=' + Date.now());
                if (!res.ok) throw new Error();
                const peliculas = await res.json();
                const grid = document.getElementById('listaPeliculas');
                grid.innerHTML = '';
                peliculas.forEach(peli => {
                    const card = document.createElement('a');
                    card.href = `player.html?url=${encodeURIComponent(peli.videoUrl)}`;
                    card.className = 'pelicula';
                    card.innerHTML = `
                        <img src="${peli.portada}" alt="${peli.titulo}" onerror="this.src='https://via.placeholder.com/200x300?text=Sin+portada'">
                        <div class="titulo">${escapeHTML(peli.titulo)}</div>
                    `;
                    grid.appendChild(card);
                });
            } catch(e) {
                document.getElementById('listaPeliculas').innerHTML = '<p style="text-align:center">❌ No hay películas. Ve al panel de administración.</p>';
            }
        }
        function escapeHTML(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        cargarPeliculas();
    </script>
</body>
</html>
